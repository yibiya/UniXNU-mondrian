findings = ["2026-11-12 stage A on hardware: all 22 PongAdreno steps returned result=0 with no SKIP and no FAIL, from parent ARC votes and CX clocks through GMU firmware/HFI, GMU power handshake, PAS13 ZAP auth, CP ME_INIT bootstrap, CP fence and CP/user-client startup (console-20261112-211647.log:480-521). The native BO pool took the full 256 MiB on the first try (a=0x10000000). GPU SMMU actual IDs read 0x4c017e1840000016/0x5511 without an ASID lease conflict, so the K60 SID routing matches Pong. Nothing printed SKIP GX already powered, so the bootloader had not pre-powered the GPU.", "K60FB base=0xb8000000 end=0xb9194000 -> outside managed range, on the same boot. The VM manages 4864 MiB from physBase 0x900000000 upward, so the ABL framebuffer at 2.875 GiB is outside it and R1 (GPU DMA racing the VM for the same pages) does not apply. The gate that held scanout back is cleared by measurement.", "The three Pong scanout patches are in patches/xnu/series:195-197 in the source order SCANOUT, GPUONLY, PITCH, and the whole 216-entry series applies to a clean xnu-8796.141.3 with git apply -C0: 0 failures, 0 fuzz (docs/plans/GPU-ENABLE-PLAN.md 7.1). SCANOUT carries the K60 insertion point and GPUONLY no longer contains the MiniIOSurface.cpp startup gate that would have overridden 0211."]
completion = ["GPU submissions complete, mapping/fence handling is correct, a known image renders, and the selected Metal client presents it."]
limits = ["User confirms normal candidate visible frame rate correct. INTF1 count60→1 hardware60.5Hz normal/60.6Hz diagnostic, readback matches; no120fps claim. Actual touch still ineffective and is an independent acquisition issue. Existing mapping warnings and unknown GPU capabilities remain."]
next_action = ["Keep qualified panel correction unchanged while repairing actual Goodix acquisition. Preserve CPUfallback and guards; only fastboot boot withauto300return."]
evidence = [{ kind = "device", reference = "scripts/build-pong-adreno-platform-linux.py", command = "fastboot -s be74ba07 boot E:/k60-ios/boot-gpu8-start-20261112.img; boot_capture2.py --seconds 240 --idle 0", revision = "61544e3f6736506485b10a3f635a6d2e87a95a10", result = "console-20261112-013119.log 72314B: startup requested, secure RSC read refused at0x17a2000c return0xfffffffffffffffe, FAIL parent votes. No accelerator published. Authentic K60 GMU/SQE/ZAP firmware is embedded, but GMU/CP/fence execution did not begin." }, { kind = "source", reference = "https://github.com/Emilelu/UniXNU-mondrian (upstream/main in work/up-device)", command = "git show upstream/main:drivers/PongAdreno/PongAdrenoPlatform.cpp; git show upstream/main:porting.toml", revision = "609e51aec8ffc5b06d844d3444ad1349abf598be", result = "The upstream driver maps 0x17a20000/0x10000 directly and never calls secure I/O, and its record reports all 22 startup steps result=0 with parent ARC votes acknowledged and the accelerator published. That is the evidence the local secure-IO route was the deviation, so the direct mapping and retained-highest-corner selection are adopted. Upstream still reports rendering unverified and scanout off." }, { kind = "host", reference = "scripts/build-pong-userspace-linux.py", command = "python3 scripts/build-pong-userspace-linux.py --core core --mesa work/refs/mesa --translator work/refs/metal2vulkan --sdk-root work/iPhoneOS16.5.sdk --venv venv --output-dir work/gpu-userspace", revision = "0eb295a0256d9548567eae347eb763ce6e46392d", result = "Linux cross-build completed rc=0: Turnip 687/687 objects compiled and libvulkan_freedreno.dylib linked, the metal2vulkan crates compiled to the bridge staticlib and linked into PongMetalBridge.dylib, and PongAdrenoMetal linked; all three are arm64 Mach-O dylibs with NOUNDEFS, and the publication marker is 0. Build evidence only: the kernel publishes no accelerator, so no device execution happened." }, { kind = "device", reference = "docs/plans/GPU-ENABLE-PLAN.md", command = "fastboot -s be74ba07 boot E:/k60-ios/boot-gpuG-20261113.img; boot_capture2.py --seconds 330 --idle 30", revision = "c80b157ede84bac4f465fbd50766f53809fbfe16", result = "console-20261113-133222.log 190388B: lines333-344 remove only an empty root-owned legacy bundle file, create directories, deploy6/6 error0 and union stage5 error0. Lines998-1012 create a real Vulkan-backed device and GPU worker; lines1411,1448,1576 complete GPU sequences1-3 with matching presenter copy completion. No GPU copy not retired. Image SHA25607494193636b529043178399cd4c80169d3c87c9bd55b286731fdaa718b2d036; compiled kernel58ca1167, payload kernel077b9d7d (existing8-byte AppleARMCPU validation patch). User observes substantially improved picture but visible updates about1fps; late driver samples7-15fps are not panel refresh measurements." }, {kind = "device", reference = "docs/plans/GPU-ENABLE-PLAN.md", command = "fastboot -s be74ba07 boot E:/k60-ios/boot-gpuH-20261113.img; boot_capture2.py --seconds330 --idle30", revision = "b57630a78ee62130e68b4a37766de1b7fa99e130", result = "console-20261113-141731.log 1526836B; GPU sequences1-3 complete and native rendering counters c1958/d1956 at60s. Late driver42-44fps,13.6-17.4ms/frame after bounded cross-span batching; user reports unchanged visible cadence about1fps.6552 managed physical-page warnings. Boot image SHA25616c6efb138f3133ec2125a428e52e385f3e2f51776be511fc8d834472830ef1f. USB read failed at305.67s; visible smoothness remains unqualified."} , {kind = "device", reference = "docs/plans/GPU-ENABLE-PLAN.md", command = "fastboot -s be74ba07 boot E:/k60-ios/boot-gpuI-20261113.img; boot_capture2.py --seconds 330 --idle 30", revision = "a1b999f6b158265d2ab81b5b6e205eb9b5dec7fd", result = "console-20261113-174827.log 229833B;4326 completed GPU copies sampled at256 RGB points,1326 source/1319 target transitions,7 mismatches,1522 source mutations during copy. Copy13-15ms,backboardd7151 completed commands