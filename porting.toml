evidence = [{ kind = "device", reference = "patches/xnu-ipados18/0244-k60-breadcrumbs.patch", command = "scripts/k60-device.sh boot /mnt/d/Android/k60-ios/boot-darwin24-bc4.img; count the breadcrumb squares", revision = "e636e445b621bed4fac0069f3604b87061350a8d", result = "Breadcrumbs turned a silent reset into a located fault: column 1 showed six squares, column 2 zero, column 3 one, which put the death inside ml_parse_cpu_topology(). The first carrier (u64 slots at 0xA73FF000) was useless because a hung board never returns DRAM, so the markers moved into the framebuffer; 0245 then produced a readable panic on hardware." }, { kind = "device", reference = "docs/reference/ROUTE-A-18-UPSTREAM.md", command = "scripts/k60-device.sh boot /mnt/d/Android/k60-ios/boot-darwin24-bc7.img", revision = "350d1c57c86d2fc562c7fa7529271fdae3af95bc", result = "The upstream entry probe installs on this kernel: stage 1 blue bar, stage 2 magenta bar, stage 3 resets the board through PSCI six seconds after the MMU comes on. The board walked back to fastboot and then to Android by itself, so a hung kernel no longer needs a manual power cycle. The probe's panic screen stays off because it installs code in the padding after panic(), at an address fixed for the reference kernel." }]
